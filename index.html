<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#255f85">
  <title>My English House</title>
  <style>
    :root{--ink:#17324d;--blue:#255f85;--sky:#e9f7ff;--cream:#fffaf0;--coral:#f07167;--gold:#f7c948;--green:#4da167;--purple:#7768ae;--line:#cfe2ee;--shadow:0 10px 28px #17324d1d}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(145deg,#e8f7ff,#fff7e3);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
    .app{max-width:1180px;margin:auto;padding:16px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#ffffffdd;border:2px solid white;border-radius:22px;padding:12px 16px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:20;backdrop-filter:blur(10px)}
    .brand{display:flex;align-items:center;gap:10px}.logo{font-size:2rem}.brand h1{font-size:clamp(1rem,3vw,1.55rem);margin:0;letter-spacing:.04em}.brand small{display:block;color:#526e82}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn{border:0;border-radius:14px;padding:11px 15px;background:var(--blue);color:white;font-weight:800;box-shadow:0 4px 0 #174463;min-height:44px}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #174463}.btn.secondary{background:white;color:var(--blue);border:2px solid var(--line);box-shadow:none}.btn.coral{background:var(--coral);box-shadow:0 4px 0 #b94841}.btn.green{background:var(--green);box-shadow:0 4px 0 #2d7143}.btn.gold{background:var(--gold);color:#4b3a00;box-shadow:0 4px 0 #bd8e0c}.btn:focus-visible,.card:focus-visible{outline:4px solid #111;outline-offset:3px}
    main{padding:18px 0}.panel{background:#ffffffed;border:2px solid white;border-radius:26px;padding:clamp(16px,4vw,32px);box-shadow:var(--shadow);min-height:620px}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center}.hero h2{font-size:clamp(2.3rem,7vw,5rem);line-height:.92;margin:.1em 0;color:var(--blue);text-shadow:3px 3px 0 #bfe8fb}.hero p{font-size:1.2rem;max-width:52ch}.hero-art{background:var(--sky);border:3px solid var(--line);border-radius:26px;padding:14px}.house{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.room{min-height:190px;border-radius:18px;padding:10px;border:3px solid #ffffffaa;position:relative;overflow:hidden}.room h3{margin:0 0 8px;background:#ffffffd9;border-radius:999px;padding:6px;text-align:center}.kitchen{background:#ffe5b8}.living{background:#d7f4df}.bedroom{background:#e4ddff}.mini-icons{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.mini-icons svg{width:62px;height:62px}
    .activity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:24px}.card{border:2px solid var(--line);border-radius:20px;padding:18px;background:white;text-align:left;transition:.18s;min-height:160px;color:var(--ink)}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#74bde5}.card .num{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--blue);color:white;font-weight:900}.card h3{margin:12px 0 6px}.card p{margin:0;color:#526e82}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.section-head h2{font-size:clamp(1.6rem,4vw,2.6rem);margin:0;color:var(--blue)}.section-head p{margin:4px 0;color:#526e82}.tools{display:flex;gap:8px;flex-wrap:wrap}.status{background:#eef8fc;border:2px solid var(--line);padding:12px 16px;border-radius:16px;margin:14px 0;min-height:52px;font-weight:700}.status.ok{background:#e0f6e6;border-color:#7dc78e}.status.no{background:#ffebe8;border-color:#f19a92}.status.hint{background:#fff4cc;border-color:#e7c752}
    .object-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.object{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;min-height:155px;position:relative}.object:hover{border-color:var(--blue)}.object svg{width:100px;height:90px;display:block;margin:auto}.object strong{display:block;font-size:1.05rem;margin-top:5px}.object .speaker{position:absolute;right:7px;top:7px;border:0;background:#e9f7ff;border-radius:999px;width:36px;height:36px}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.choice{border:3px solid var(--line);background:white;border-radius:18px;padding:16px;font-weight:800;min-height:64px;color:var(--ink)}.choice:hover{border-color:var(--blue)}.choice.correct{background:#dff5e5;border-color:var(--green)}.choice.wrong{background:#ffe4e0;border-color:var(--coral)}
    .big-prompt{text-align:center;background:var(--sky);border-radius:22px;padding:18px;margin:12px 0 18px}.big-prompt h3{font-size:clamp(1.4rem,4vw,2.3rem);margin:5px}.big-prompt svg{width:150px;height:120px}.steps{display:flex;gap:7px;justify-content:center;margin-bottom:16px}.dot{width:16px;height:16px;border-radius:50%;background:#d5e5ed}.dot.done{background:var(--green)}.dot.now{background:var(--gold);outline:3px solid #f5d975}
    .count-scene{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#fff7d8;border-radius:20px;padding:20px}.count-scene svg{width:78px;height:70px}.number-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.number-card{background:white;border:2px solid var(--line);border-radius:16px;padding:15px;text-align:center}.number-card b{font-size:2rem;display:block}.teen{color:var(--coral);font-weight:900}.builder{display:grid;grid-template-columns:260px 1fr;gap:18px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}.palette .object{min-height:120px;padding:7px}.palette .object svg{width:68px;height:62px}.canvas-room{min-height:420px;border:4px solid #a98ccf;border-radius:20px;background:linear-gradient(#efe8ff 0 72%,#c58b5f 72%);position:relative;overflow:hidden}.placed{position:absolute;width:100px;height:90px;filter:drop-shadow(2px 4px 2px #0002);touch-action:none}.placed svg{width:100%;height:100%}.placed button{position:absolute;right:-8px;top:-8px;width:28px;height:28px;border:0;border-radius:50%;background:var(--coral);color:#fff;font-weight:900}.sentence-box{margin-top:12px;display:flex;gap:8px}.sentence-box input{flex:1;padding:12px;border:2px solid var(--line);border-radius:14px}.teacher-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.setting{border:2px solid var(--line);border-radius:18px;padding:16px;background:#fff}.setting label{display:flex;justify-content:space-between;gap:12px;font-weight:800}.setting select{padding:8px;border-radius:10px;border:2px solid var(--line)}.results{width:100%;border-collapse:collapse}.results td,.results th{padding:10px;border-bottom:1px solid var(--line);text-align:left}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.footer{text-align:center;color:#567184;padding:14px;font-size:.9rem}
    @media(max-width:760px){.hero{grid-template-columns:1fr}.house{grid-template-columns:1fr}.room{min-height:130px}.builder{grid-template-columns:1fr}.palette{grid-template-columns:repeat(3,1fr)}.top{position:static}.brand small{display:none}.panel{min-height:0}.number-grid{grid-template-columns:repeat(2,1fr)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">🏠</span><div><h1>MY ENGLISH HOUSE</h1><small>Explore, listen, play and learn!</small></div></div>
    <div class="top-actions"><button class="btn secondary" id="homeBtn">⌂ Home</button><button class="btn secondary" id="audioBtn">🔊 Audio on</button><button class="btn" id="teacherBtn">Teacher mode</button></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="footer">No account · No advertising · Progress stays on this device · Audio depends on the browser voice</footer>
</div>
<script>
(()=>{'use strict';
const FURNITURE=[
 {id:'fridge',name:'fridge',room:'kitchen',color:'#8dc8e8'}, {id:'cooker',name:'cooker',room:'kitchen',color:'#adb6c4'},
 {id:'table',name:'table',room:'kitchen',color:'#c98d5b'}, {id:'chair',name:'chair',room:'kitchen',color:'#e4a85e'},
 {id:'cupboard',name:'cupboard',room:'kitchen',color:'#f0b56a'}, {id:'armchair',name:'armchair',room:'living room',color:'#e8877d'},
 {id:'bookcase',name:'bookcase',room:'living room',color:'#9c6b43'}, {id:'television',name:'television',room:'living room',color:'#606b78'},
 {id:'bed',name:'bed',room:'bedroom',color:'#6aa9d4'}, {id:'wardrobe',name:'wardrobe',room:'bedroom',color:'#b88962'},
 {id:'lamp',name:'lamp',room:'bedroom',color:'#f4c84c'}
];
const NUMBERS=[['13','thir','teen'],['14','four','teen'],['15','fif','teen'],['16','six','teen'],['17','seven','teen'],['18','eigh','teen'],['19','nine','teen'],['20','twenty','']];
const guided=['lamp','bed','fridge','table','chair','wardrobe'];
const defaults={audio:true,labels:true,hints:true,numbers:true,level:'standard',lim:false,progress:{},results:[],bedroom:[],sentence:''};
let state=load(), screen='home', current=null, round=0, attempts=0, selected=null;
function load(){try{return Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem('meh-state')||'{}'))}catch(e){return structuredClone(defaults)}}
function save(){try{localStorage.setItem('meh-state',JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function svg(item){const c=item.color,n=item.id;let shape='';
 if(n==='fridge')shape='<rect x="28" y="8" width="64" height="100" rx="8"/><path d="M28 48h64M80 24v14M80 61v18"/>';
 else if(n==='cooker')shape='<rect x="19" y="25" width="82" height="79" rx="7"/><path d="M19 48h82M32 35h8m12 0h8m12 0h8M34 63h52v28H34z"/>';
 else if(n==='table')shape='<path d="M16 42h88v18H16zM27 60h10v50H27zm56 0h10v50H83z"/>';
 else if(n==='chair')shape='<path d="M31 17h51v55H31zM27 67h62v16H27zM34 83h10v28H34zm36 0h10v28H70z"/>';
 else if(n==='cupboard')shape='<rect x="18" y="11" width="84" height="99" rx="5"/><path d="M60 11v99M53 60h3m8 0h3"/>';
 else if(n==='armchair')shape='<path d="M27 51V30q0-16 16-16h34q16 0 16 16v21M18 47q0-9 9-9t9 9v30h48V47q0-9 9-9t9 9v54H18zM29 101v10m62-10v10"/>';
 else if(n==='bookcase')shape='<rect x="21" y="8" width="78" height="104" rx="3"/><path d="M21 40h78M21 75h78M35 18v18m16-14v14m22-16v16M31 50v20m18-15v15m25-20v20M34 85v22m20-18v18m25-23v23"/>';
 else if(n==='television')shape='<rect x="12" y="20" width="96" height="68" rx="9"/><path d="M60 88v15M38 105h44M44 12l16 8 16-8"/>';
 else if(n==='bed')shape='<path d="M10 63h100v36H10zM18 36h18v27H18zM36 46h65q9 0 9 17H36zM19 99v12m82-12v12"/>';
 else if(n==='wardrobe')shape='<rect x="19" y="8" width="82" height="104" rx="5"/><path d="M60 8v104M51 61h4m10 0h4M30 112v-8m60 8v-8"/>';
 else shape='<path d="M38 15h44l-9 36H47zM60 51v37M43 105h34M48 88h24v17H48z"/>';
 return `<svg viewBox="0 0 120 120" role="img" aria-label="${item.name}"><g fill="${c}" stroke="#17324d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${shape}</g></svg>`}
function speak(text){if(!state.audio||!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.82;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function item(id){return FURNITURE.find(x=>x.id===id)}
function setStatus(text,type=''){const e=document.querySelector('#status');if(e){e.className='status '+type;e.textContent=text;e.focus?.()}}
function mark(skill,ok,help=false){state.results.push({time:new Date().toLocaleString(),skill,result:ok?'correct':'incorrect',help:help?'yes':'no'});state.progress[skill]=(state.progress[skill]||0)+(ok?1:0);save()}
function shell(title,sub,body,tools=''){return `<section class="panel"><div class="section-head"><div><h2>${title}</h2><p>${sub}</p></div><div class="tools">${tools}</div></div>${body}</section>`}
function go(name){screen=name;attempts=0;selected=null;current=null;render();document.querySelector('#main').focus();scrollTo({top:0,behavior:'smooth'})}
function home(){const rooms=['kitchen','living room','bedroom'].map(r=>`<div class="room ${r==='living room'?'living':r}"><h3>${r==='living room'?'Living room / sitting room':r[0].toUpperCase()+r.slice(1)}</h3><div class="mini-icons">${FURNITURE.filter(x=>x.room===r).map(svg).join('')}</div></div>`).join('');
 const activities=[['explore','1','Explore the house','Discover rooms and furniture.'],['listen','2','Listen and find','Hear a word and choose the picture.'],['put','3','Put it in the house','Follow simple English instructions.'],['match','4','Match the furniture','Connect words and pictures.'],['grammar','5','There is / There are','Count and complete a sentence.'],['numbers','6','Numbers 13–20','Optional number practice.'],['builder','★','Design your bedroom','Create a room and write sentences.'],['final','✓','Final challenge','Three short checks plus vocabulary.']];
 return `<section class="panel hero"><div><span class="btn gold" style="display:inline-block">English · Class 4</span><h2>MY<br>ENGLISH<br>HOUSE</h2><p>Explore three rooms, meet eleven pieces of furniture, listen, play and learn at your own pace.</p><button class="btn coral" data-go="explore">Start exploring →</button></div><div><div class="hero-art"><div class="house">${rooms}</div></div><div class="activity-grid">${activities.filter(a=>state.numbers||a[0]!=='numbers').map(a=>`<button class="card" data-go="${a[0]}"><span class="num">${a[1]}</span><h3>${a[2]}</h3><p>${a[3]}</p></button>`).join('')}</div></div></section>`}
function explore(){const room=current||'kitchen';const names=['kitchen','living room','bedroom'];return shell('Explore the house','Tap an object to hear and read its English name.',`<div class="tools">${names.map(r=>`<button class="btn ${r===room?'':'secondary'}" data-room="${r}">${r}</button>`).join('')}</div><div id="status" class="status" tabindex="-1">Choose a piece of furniture.</div><div class="object-grid">${FURNITURE.filter(x=>x.room===room).map(x=>objectCard(x,true)).join('')}</div>`,`<button class="btn secondary" id="labelToggle">${state.labels?'Hide':'Show'} labels</button>`)}
function objectCard(x,audio=false){return `<button class="object" data-object="${x.id}" aria-label="${x.name}">${svg(x)}<strong>${state.labels?x.name:'?'}</strong>${audio?'<span class="speaker" aria-hidden="true">🔊</span>':''}</button>`}
function listen(){if(!current){const pool=state.level==='guided'?FURNITURE.filter(x=>guided.includes(x.id)):FURNITURE;current=shuffle(pool)[0]}const pool=state.level==='guided'?FURNITURE.filter(x=>guided.includes(x.id)):FURNITURE;let opts=shuffle([current,...shuffle(pool.filter(x=>x.id!==current.id)).slice(0,state.level==='challenge'?5:3)]);return shell('Listen and find','Listen first. The English labels are hidden.',`<div class="steps">${[0,1,2,3,4,5].map((_,i)=>`<i class="dot ${i<round?'done':i===round?'now':''}"></i>`).join('')}</div><div class="big-prompt"><button class="btn coral" id="playPrompt">🔊 Listen again</button>${!state.audio?`<h3>It’s a ${current.name}.</h3><p>Text alternative is on; listening is not assessed.</p>`:''}</div><div id="status" class="status" tabindex="-1">Choose the matching picture.</div><div class="choice-grid">${opts.map(x=>`<button class="choice" data-answer="${x.id}">${svg(x)}</button>`).join('')}</div>`)}
function put(){if(!current)current=shuffle(FURNITURE)[0];return shell('Put it in the house','Select the object, then select the requested room.',`<div class="big-prompt"><h3>Put the ${current.name} in the ${current.room}.</h3><button class="btn secondary" id="speakInstruction">🔊 Hear instruction</button></div><div id="status" class="status" tabindex="-1">Step 1: choose the ${current.name}.</div><div class="object-grid">${shuffle(FURNITURE).slice(0,state.level==='guided'?6:11).map(x=>objectCard(x)).join('')}</div><h3>Rooms</h3><div class="choice-grid">${['kitchen','living room','bedroom'].map(r=>`<button class="choice" data-destination="${r}">${r}</button>`).join('')}</div>`)}
function match(){if(!current)current=shuffle(FURNITURE)[0];const pictureMode=round%2===0;const opts=shuffle([current,...shuffle(FURNITURE.filter(x=>x!==current)).slice(0,state.level==='challenge'?4:2)]);return shell('Match the furniture',pictureMode?'Picture to word':'Word to picture',`<div class="steps">${[0,1,2,3,4,5].map((_,i)=>`<i class="dot ${i<round?'done':i===round?'now':''}"></i>`).join('')}</div><div class="big-prompt">${pictureMode?svg(current):`<h3>${current.name}</h3>`}</div><div id="status" class="status" tabindex="-1">Choose the match.</div><div class="choice-grid">${opts.map(x=>`<button class="choice" data-answer="${x.id}">${pictureMode?x.name:svg(x)}</button>`).join('')}</div>`)}
function grammar(){const examples=[{id:'bed',n:1},{id:'chair',n:2},{id:'lamp',n:3},{id:'table',n:1}];if(!current)current=examples[round%examples.length];const x=item(current.id),verb=current.n===1?'is':'are';return shell('There is / There are','Look, count and choose the correct verb.',`<div class="count-scene">${Array(current.n).fill(svg(x)).join('')}</div><div class="big-prompt"><h3>There ___ ${current.n===1?'one':current.n===2?'two':'three'} ${x.name}${current.n>1?'s':''}.</h3>${state.hints?'<p>Use <b>is</b> for one. Use <b>are</b> for more than one.</p>':''}</div><div id="status" class="status" tabindex="-1">Choose is or are.</div><div class="choice-grid"><button class="choice" data-grammar="is">is</button><button class="choice" data-grammar="are">are</button></div>`)}
function numbers(){return shell('Numbers 13–20','This optional module does not affect furniture recovery.',`<div class="number-grid">${NUMBERS.map(n=>`<button class="number-card" data-number="${n[0]}"><b>${n[0]}</b><span>${n[1]}<span class="teen">${n[2]}</span></span><br><span aria-hidden="true">🔊</span></button>`).join('')}</div><div id="status" class="status">Tap a card to hear the number. Notice the <span class="teen">teen</span> ending from 13 to 19.</div><div class="big-prompt"><h3>Quick check</h3><p>Listen and choose the number.</p><button class="btn coral" id="numberPrompt">🔊 Listen</button></div><div class="choice-grid"><button class="choice" data-num-answer="13">13</button><button class="choice" data-num-answer="16">16</button><button class="choice" data-num-answer="18">18</button></div>`)}
function builder(){const allowed=FURNITURE.filter(x=>['bed','chair','lamp','wardrobe','bookcase','armchair'].includes(x.id));return shell('Design your bedroom','Add furniture, move it by dragging, and write an English sentence.',`<div class="builder"><div><h3>Furniture</h3><div class="palette">${allowed.map(x=>objectCard(x)).join('')}</div><p><b>Task:</b> Add one bed, two chairs and one lamp.</p></div><div><div class="canvas-room" id="roomCanvas" aria-label="Bedroom design area">${state.bedroom.map((p,i)=>`<div class="placed" data-placed="${i}" style="left:${p.x}%;top:${p.y}%">${svg(item(p.id))}<button data-remove="${i}" aria-label="Remove ${p.id}">×</button></div>`).join('')}</div><div class="sentence-box"><label class="sr-only" for="sentence">English sentence</label><input id="sentence" value="${esc(state.sentence)}" placeholder="There is one bed."><button class="btn green" id="saveSentence">Save</button></div></div></div>`,`<button class="btn secondary" id="clearRoom">Clear room</button><button class="btn" id="exportPng">Export PNG</button>`)}
function final(){if(!current)current={step:0};const s=current.step;let content='';if(s===0)content=`<div class="big-prompt">${svg(item('wardrobe'))}<h3>What is it?</h3></div><div class="choice-grid">${['wardrobe','cupboard','bookcase'].map(v=>`<button class="choice" data-final="${v}">${v}</button>`).join('')}</div>`;else if(s===1)content=`<div class="big-prompt"><button class="btn coral" id="finalSpeak">🔊 Hear the number</button><h3>Choose the number.</h3></div><div class="choice-grid">${['13','16','18'].map(v=>`<button class="choice" data-final="${v}">${v}</button>`).join('')}</div>`;else if(s===2)content=`<div class="count-scene">${svg(item('chair'))}${svg(item('chair'))}</div><div class="big-prompt"><h3>There ___ two chairs.</h3></div><div class="choice-grid"><button class="choice" data-final="is">is</button><button class="choice" data-final="are">are</button></div>`;else content=`<div class="big-prompt"><h3>Challenge complete!</h3><p>These three checks record vocabulary, numbers and grammar separately. They do not certify the whole unit.</p><button class="btn green" data-go="home">Back home</button></div>`;return shell('Final challenge','Three short, separate checks.',`<div class="steps">${[0,1,2].map((_,i)=>`<i class="dot ${i<s?'done':i===s?'now':''}"></i>`).join('')}</div><div id="status" class="status" tabindex="-1">Do your best.</div>${content}`)}
function teacher(){const rows=state.results.slice(-20).reverse().map(r=>`<tr><td>${esc(r.time)}</td><td>${esc(r.skill)}</td><td>${r.result}</td><td>${r.help}</td></tr>`).join('')||'<tr><td colspan="4">No results yet.</td></tr>';return shell('Teacher mode','Settings and anonymous results stored only in this browser.',`<div class="teacher-grid"><div class="setting"><label>Support level <select id="level"><option value="guided">Guided</option><option value="standard">Standard</option><option value="challenge">Challenge</option></select></label><p>Guided support is documented, not penalized.</p></div><div class="setting"><label>Show hints <input type="checkbox" id="hints" ${state.hints?'checked':''}></label><p>Progressive visual and language support.</p></div><div class="setting"><label>Numbers module <input type="checkbox" id="numbersOn" ${state.numbers?'checked':''}></label><p>Optional and independent from furniture recovery.</p></div><div class="setting"><label>LIM mode <input type="checkbox" id="lim" ${state.lim?'checked':''}></label><p>Larger controls for collective use.</p></div></div><h3>Recent results</h3><div style="overflow:auto"><table class="results"><thead><tr><th>Time</th><th>Skill</th><th>Result</th><th>Help</th></tr></thead><tbody>${rows}</tbody></table></div>`,`<button class="btn" id="csv">Export CSV</button><button class="btn coral" id="reset">Reset session</button>`)}
function render(){const views={home,explore,listen,put,match,grammar,numbers,builder,final,teacher};document.querySelector('#main').innerHTML=(views[screen]||home)();document.querySelector('#audioBtn').textContent=state.audio?'🔊 Audio on':'🔇 Text mode';document.body.style.fontSize=state.lim?'115%':'';bind();if(screen==='listen'&&state.audio)setTimeout(()=>speak(`It's a ${current.name}.`),200);if(screen==='teacher')document.querySelector('#level').value=state.level}
function nextActivity(kind,delay=650){setTimeout(()=>{attempts=0;selected=null;if(kind==='listen'||kind==='match'){round=(round+1)%6;current=null}else if(kind==='grammar'){round=(round+1)%4;current=null}render()},delay)}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{current=b.dataset.room;render()});
 document.querySelector('#labelToggle')?.addEventListener('click',()=>{state.labels=!state.labels;save();render()});
 document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>{const x=item(b.dataset.object);if(screen==='explore'){speak(x.name);mark('furniture exploration',true);setStatus(x.name.toUpperCase()+' — tap the speaker to listen again.','ok')}else if(screen==='put'){selected=x.id;if(x.id===current.id){setStatus('Good. Step 2: choose the '+current.room+'.','ok')}else{attempts++;setStatus(state.hints?'Try again. Look for the '+current.name+'.':'Try again.','no')}}else if(screen==='builder'){state.bedroom.push({id:x.id,x:10+(state.bedroom.length*13)%70,y:15+(state.bedroom.length*17)%48});save();render()}});
 document.querySelector('#playPrompt')?.addEventListener('click',()=>speak(`It's a ${current.name}.`));
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer===current.id;if(ok){b.classList.add('correct');mark(screen==='listen'?'listening':'matching',true,attempts>0);setStatus('Well done! '+current.name+'.','ok');speak(current.name);nextActivity(screen)}else{b.classList.add('wrong');attempts++;mark(screen==='listen'?'listening':'matching',false);setStatus(attempts>1&&state.hints?'Look carefully: the word starts with “'+current.name[0].toUpperCase()+'”.':'Try once more.','no')}});
 document.querySelector('#speakInstruction')?.addEventListener('click',()=>speak(`Put the ${current.name} in the ${current.room}.`));
 document.querySelectorAll('[data-destination]').forEach(b=>b.onclick=()=>{if(selected!==current.id){setStatus('First choose the '+current.name+'.','hint');return}const ok=b.dataset.destination===current.room;mark('instructions',ok,attempts>0);if(ok){setStatus('Excellent! The '+current.name+' is in the '+current.room+'.','ok');setTimeout(()=>{current=shuffle(FURNITURE)[0];render()},700)}else{attempts++;setStatus('Try another room.','no')}});
 document.querySelectorAll('[data-grammar]').forEach(b=>b.onclick=()=>{const expected=current.n===1?'is':'are',ok=b.dataset.grammar===expected;mark('there is / there are',ok,attempts>0);if(ok){b.classList.add('correct');setStatus('Correct: There '+expected+'…','ok');nextActivity('grammar')}else{attempts++;b.classList.add('wrong');setStatus('Try again. Count the objects.','no')}});
 document.querySelectorAll('[data-number]').forEach(b=>b.onclick=()=>{const n=NUMBERS.find(x=>x[0]===b.dataset.number);speak(n[1]+n[2]);setStatus(n[0]+' — '+n[1]+n[2],'ok')});
 document.querySelector('#numberPrompt')?.addEventListener('click',()=>speak('sixteen'));document.querySelectorAll('[data-num-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.numAnswer==='16';mark('numbers',ok);b.classList.add(ok?'correct':'wrong');setStatus(ok?'Correct: sixteen is 16.':'Listen again and try once more.',ok?'ok':'no')});
 document.querySelector('#saveSentence')?.addEventListener('click',()=>{state.sentence=document.querySelector('#sentence').value.trim();save();setStatus?.('Sentence saved.','ok')});
 document.querySelector('#clearRoom')?.addEventListener('click',()=>{state.bedroom=[];save();render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.bedroom.splice(+b.dataset.remove,1);save();render()});bindDrag();
 document.querySelector('#exportPng')?.addEventListener('click',exportRoom);
 document.querySelector('#finalSpeak')?.addEventListener('click',()=>speak('sixteen'));document.querySelectorAll('[data-final]').forEach(b=>b.onclick=()=>{const expected=['wardrobe','16','are'][current.step],skill=['vocabulary','numbers','grammar'][current.step],ok=b.dataset.final===expected;mark('final '+skill,ok,attempts>0);if(ok){b.classList.add('correct');setStatus('Correct!','ok');setTimeout(()=>{current.step++;attempts=0;render()},650)}else{attempts++;b.classList.add('wrong');setStatus('Try again.','no')}});
 document.querySelector('#level')?.addEventListener('change',e=>{state.level=e.target.value;save()});document.querySelector('#hints')?.addEventListener('change',e=>{state.hints=e.target.checked;save()});document.querySelector('#numbersOn')?.addEventListener('change',e=>{state.numbers=e.target.checked;save()});document.querySelector('#lim')?.addEventListener('change',e=>{state.lim=e.target.checked;save();render()});document.querySelector('#csv')?.addEventListener('click',exportCsv);document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('Reset all local progress and room design?')){state=structuredClone(defaults);save();render()}})}
function bindDrag(){document.querySelectorAll('.placed').forEach(el=>{let start=null;el.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;el.setPointerCapture(e.pointerId);const room=document.querySelector('#roomCanvas').getBoundingClientRect();start={x:e.clientX,y:e.clientY,l:parseFloat(el.style.left),t:parseFloat(el.style.top),room}};el.onpointermove=e=>{if(!start)return;const nx=Math.max(0,Math.min(82,start.l+(e.clientX-start.x)/start.room.width*100)),ny=Math.max(0,Math.min(72,start.t+(e.clientY-start.y)/start.room.height*100));el.style.left=nx+'%';el.style.top=ny+'%'};el.onpointerup=()=>{if(!start)return;const i=+el.dataset.placed;state.bedroom[i].x=parseFloat(el.style.left);state.bedroom[i].y=parseFloat(el.style.top);start=null;save()}})}
function exportCsv(){const rows=[['time','skill','result','help'],...state.results.map(r=>[r.time,r.skill,r.result,r.help])];download('my-english-house-results.csv',rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}
function exportRoom(){const w=900,h=600;let content=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="900" height="430" fill="#efe8ff"/><rect y="430" width="900" height="170" fill="#c58b5f"/><text x="30" y="45" font-family="Arial" font-size="28" fill="#17324d">My English House — My bedroom</text>`;state.bedroom.forEach(p=>{const node=svg(item(p.id)).replace('<svg ',`<svg x="${p.x/100*760}" y="${p.y/100*430}" width="120" height="120" `);content+=node});content+=`<rect x="20" y="535" width="860" height="48" rx="12" fill="white"/><text x="40" y="568" font-family="Arial" font-size="25" fill="#17324d">${esc(state.sentence||'My bedroom')}</text></svg>`;const img=new Image(),blob=new Blob([content],{type:'image/svg+xml'}),url=URL.createObjectURL(blob);img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>{const a=URL.createObjectURL(b);downloadUrl('my-bedroom.png',a)},'image/png')};img.src=url}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));downloadUrl(name,url)}function downloadUrl(name,url){const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('#homeBtn').onclick=()=>go('home');document.querySelector('#teacherBtn').onclick=()=>go('teacher');document.querySelector('#audioBtn').onclick=()=>{state.audio=!state.audio;save();render()};render();
})();
</script>
</body>
</html>
